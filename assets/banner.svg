<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>

    <!-- ── GRADIENTS ── -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#05080F"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FACC15" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#FACC15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="white" stop-opacity="1"/>
      <stop offset="52%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="78%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- ── GRID ── -->
    <pattern id="g" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44,0 L0,0 0,44" fill="none" stroke="#0D1825" stroke-width="0.7"/>
    </pattern>
    <mask id="gm"><rect width="1200" height="280" fill="url(#fade)"/></mask>

    <!-- ── GLOW ── -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dimglow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- BASE -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#g)" mask="url(#gm)"/>

  <!-- Top rule -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#accentLine)"/>

  <!-- Left stripe -->
  <rect x="0" y="0" width="2.5" height="280" fill="#FACC15" opacity="0.15"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT PANEL — TYPOGRAPHY                     -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Eyebrow tag -->
  <g transform="translate(52, 44)">
    <rect x="0" y="-10" width="6" height="6" rx="1" fill="#FACC15" filter="url(#glow)"/>
    <text x="16" y="-2"
      font-family="'SF Mono','JetBrains Mono','Fira Code',monospace"
      font-size="9.5" font-weight="400" fill="#484F58" letter-spacing="2.8">
      PORTFOLIO  ·  2026  ·  INDIA
    </text>
  </g>

  <!-- Name — hero weight -->
  <text x="52" y="116"
    font-family="-apple-system,'Inter','Segoe UI',Helvetica,Arial,sans-serif"
    font-size="56" font-weight="800" fill="#F8F8F8" letter-spacing="-2">
    Harshwardhan Karanje
  </text>

  <!-- Role — monospace accent -->
  <text x="54" y="150"
    font-family="'SF Mono','JetBrains Mono','Fira Code',monospace"
    font-size="12.5" font-weight="500" fill="#FACC15" letter-spacing="4">
    COMPUTER ENGINEERING STUDENT
  </text>

  <!-- Hairline separator -->
  <line x1="52" y1="168" x2="540" y2="168" stroke="#21262D" stroke-width="1"/>
  <line x1="52" y1="168" x2="112" y2="168" stroke="#FACC15" stroke-width="1.5" opacity="0.7"/>

  <!-- Domain tags -->
  <text x="52" y="190"
    font-family="-apple-system,'Inter',Helvetica,Arial,sans-serif"
    font-size="13" fill="#8B949E" letter-spacing="0.3">
    <tspan fill="#C9D1D9">AI</tspan><tspan>  ·  </tspan>
    <tspan fill="#C9D1D9">Robotics</tspan><tspan>  ·  </tspan>
    <tspan fill="#C9D1D9">UAV Systems</tspan><tspan>  ·  </tspan>
    <tspan fill="#C9D1D9">Embedded</tspan><tspan>  ·  </tspan>
    <tspan fill="#C9D1D9">IoT</tspan>
  </text>

  <!-- Tagline -->
  <text x="52" y="214"
    font-family="-apple-system,'Inter',Helvetica,Arial,sans-serif"
    font-size="12" fill="#3D444D" letter-spacing="0.1">
    Building intelligent systems at the intersection of software, embedded electronics, and autonomous flight.
  </text>

  <!-- Info chips -->
  <g transform="translate(52, 236)">
    <rect x="0"   y="0" width="100" height="20" rx="3" fill="#0D1117" stroke="#1C2128" stroke-width="1"/>
    <text x="10"  y="14" font-family="'SF Mono','JetBrains Mono',monospace" font-size="9" fill="#484F58">C++ · Python · JS</text>

    <rect x="108" y="0" width="100" height="20" rx="3" fill="#0D1117" stroke="#1C2128" stroke-width="1"/>
    <text x="118" y="14" font-family="'SF Mono','JetBrains Mono',monospace" font-size="9" fill="#484F58">ROS 2 · PX4 · MAVLink</text>

    <rect x="216" y="0" width="100" height="20" rx="3" fill="#0D1117" stroke="#1C2128" stroke-width="1"/>
    <text x="226" y="14" font-family="'SF Mono','JetBrains Mono',monospace" font-size="9" fill="#484F58">ESP32 · STM32 · RTOS</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT PANEL — UAV SCHEMATIC                 -->
  <!-- ═══════════════════════════════════════════ -->

  <g transform="translate(938, 140)">

    <!-- Radar rings (outermost → innermost) -->
    <circle cx="0" cy="0" r="122" fill="none" stroke="#0D1825" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="90"  fill="none" stroke="#FACC15" stroke-width="0.5"
            stroke-dasharray="4 8" stroke-opacity="0.18"/>
    <circle cx="0" cy="0" r="58"  fill="none" stroke="#161B22" stroke-width="1"/>
    <circle cx="0" cy="0" r="28"  fill="none" stroke="#0D1117" stroke-width="1.5"/>

    <!-- Crosshair axes -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#161B22" stroke-width="0.7" stroke-dasharray="2 7"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#161B22" stroke-width="0.7" stroke-dasharray="2 7"/>

    <!-- Sweep ray -->
    <line x1="0" y1="0" x2="86" y2="-86" stroke="#FACC15" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="86" cy="-86" r="2" fill="#FACC15" fill-opacity="0.5"/>

    <!-- ── CIRCUIT TRACES (arms) ── -->
    <!-- All arms share the same visual rhythm: dark stroke base, thin yellow dash -->
    <!-- TR arm -->
    <line x1="11" y1="-11" x2="64" y2="-64" stroke="#141C26" stroke-width="3"/>
    <line x1="11" y1="-11" x2="64" y2="-64" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="5 3" stroke-opacity="0.35"/>
    <!-- BR arm -->
    <line x1="11" y1="11" x2="64" y2="64" stroke="#141C26" stroke-width="3"/>
    <line x1="11" y1="11" x2="64" y2="64" stroke="#21262D" stroke-width="0.7" stroke-dasharray="5 3"/>
    <!-- BL arm -->
    <line x1="-11" y1="11" x2="-64" y2="64" stroke="#141C26" stroke-width="3"/>
    <line x1="-11" y1="11" x2="-64" y2="64" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="5 3" stroke-opacity="0.35"/>
    <!-- TL arm -->
    <line x1="-11" y1="-11" x2="-64" y2="-64" stroke="#141C26" stroke-width="3"/>
    <line x1="-11" y1="-11" x2="-64" y2="-64" stroke="#21262D" stroke-width="0.7" stroke-dasharray="5 3"/>

    <!-- PCB joint nodes on arms -->
    <circle cx="30"  cy="-30"  r="2" fill="#161B22" stroke="#FACC15" stroke-width="0.7" stroke-opacity="0.5"/>
    <circle cx="30"  cy="30"   r="2" fill="#161B22" stroke="#21262D" stroke-width="0.7"/>
    <circle cx="-30" cy="30"   r="2" fill="#161B22" stroke="#FACC15" stroke-width="0.7" stroke-opacity="0.5"/>
    <circle cx="-30" cy="-30"  r="2" fill="#161B22" stroke="#21262D" stroke-width="0.7"/>

    <!-- ── AIRFRAME ── -->
    <polygon points="0,-16 13,-13 16,0 13,13 0,16 -13,13 -16,0 -13,-13"
             fill="#05080F" stroke="#FACC15" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,-9 7,-7 9,0 7,7 0,9 -7,7 -9,0 -7,-7"
             fill="none" stroke="#1C2128" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#FACC15" filter="url(#dimglow)"/>

    <!-- ── ROTORS — alternating accent / muted ── -->
    <!-- TR (accent) -->
    <circle cx="64" cy="-64" r="8"  fill="#08101C" stroke="#FACC15" stroke-width="1.3" filter="url(#glow)"/>
    <circle cx="64" cy="-64" r="27" fill="none" stroke="#FACC15" stroke-width="0.6" stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <circle cx="64" cy="-64" r="2.5" fill="#FACC15"/>

    <!-- BR (muted) -->
    <circle cx="64" cy="64"  r="8"  fill="#08101C" stroke="#2D333B" stroke-width="1.3"/>
    <circle cx="64" cy="64"  r="27" fill="none" stroke="#2D333B" stroke-width="0.6" stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <circle cx="64" cy="64"  r="2.5" fill="#2D333B"/>

    <!-- BL (accent) -->
    <circle cx="-64" cy="64"  r="8"  fill="#08101C" stroke="#FACC15" stroke-width="1.3" filter="url(#glow)"/>
    <circle cx="-64" cy="64"  r="27" fill="none" stroke="#FACC15" stroke-width="0.6" stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <circle cx="-64" cy="64"  r="2.5" fill="#FACC15"/>

    <!-- TL (muted) -->
    <circle cx="-64" cy="-64" r="8"  fill="#08101C" stroke="#2D333B" stroke-width="1.3"/>
    <circle cx="-64" cy="-64" r="27" fill="none" stroke="#2D333B" stroke-width="0.6" stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <circle cx="-64" cy="-64" r="2.5" fill="#2D333B"/>

    <!-- Heading indicator -->
    <polygon points="-3,-16 0,-28 3,-16" fill="#FACC15" filter="url(#glow)"/>

    <!-- ── CALLOUT TAGS ── -->
    <!-- TR callout -->
    <polyline points="64,-72 92,-98 142,-98"
              fill="none" stroke="#FACC15" stroke-width="0.65" stroke-opacity="0.5"/>
    <rect x="142" y="-109" width="90" height="17" rx="2"
          fill="#05080F" stroke="#1C2128" stroke-width="0.8"/>
    <text x="149" y="-97"
      font-family="'SF Mono','JetBrains Mono',monospace"
      font-size="7.5" fill="#FACC15" letter-spacing="0.5">PX4  AUTOPILOT</text>

    <!-- Left callout -->
    <polyline points="-14,-12 -96,-42 -140,-42"
              fill="none" stroke="#2D333B" stroke-width="0.65"/>
    <rect x="-218" y="-53" width="78" height="17" rx="2"
          fill="#05080F" stroke="#1C2128" stroke-width="0.8"/>
    <text x="-211" y="-41"
      font-family="'SF Mono','JetBrains Mono',monospace"
      font-size="7.5" fill="#484F58" letter-spacing="0.5">MAVLink 2.0</text>

    <!-- BR callout -->
    <polyline points="64,72 92,98 142,98"
              fill="none" stroke="#2D333B" stroke-width="0.65"/>
    <rect x="142" y="89" width="76" height="17" rx="2"
          fill="#05080F" stroke="#1C2128" stroke-width="0.8"/>
    <text x="149" y="101"
      font-family="'SF Mono','JetBrains Mono',monospace"
      font-size="7.5" fill="#484F58" letter-spacing="0.5">ROS 2 Bridge</text>

  </g>

  <!-- FOOTER coords -->
  <text x="52" y="272"
    font-family="'SF Mono','JetBrains Mono',monospace"
    font-size="8.5" fill="#1C2128" letter-spacing="1.5">
    19.076°N  72.877°E  —  PUNE, INDIA
  </text>

</svg>
