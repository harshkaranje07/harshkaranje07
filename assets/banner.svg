<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <!-- Base Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#060A10"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="75%"  stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#21262D" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#21262D"/>
      <stop offset="70%"  stop-color="#21262D"/>
      <stop offset="100%" stop-color="#21262D" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0F1829" stroke-width="0.8"/>
    </pattern>
    <!-- Grid fade mask — fades out on right side -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="white" stop-opacity="1"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="300" fill="url(#gridFade)"/>
    </mask>

    <!-- Glow filter for accent elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BASE LAYER ── -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Top & bottom accent rule -->
  <rect x="0" y="0"   width="1200" height="1.5" fill="url(#topBar)"/>
  <rect x="0" y="298.5" width="1200" height="1.5" fill="url(#topBar)" opacity="0.3"/>

  <!-- Left accent column -->
  <rect x="0" y="0" width="3" height="300" fill="#FACC15" opacity="0.12"/>

  <!-- ── LEFT: TYPOGRAPHY ── -->
  <!-- Status indicator -->
  <g transform="translate(56, 46)">
    <rect x="0" y="-9" width="7" height="7" rx="1.5" fill="#FACC15" filter="url(#glow)"/>
    <text x="16" y="-1"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif"
      font-size="10" font-weight="500" fill="#6B7280" letter-spacing="2.5">
      ENGINEERING PORTFOLIO — 2026
    </text>
  </g>

  <!-- Name -->
  <text x="56" y="126"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif"
    font-size="54" font-weight="800" fill="#F8F8F8" letter-spacing="-1.5">
    Harshwardhan Karanje
  </text>

  <!-- Title -->
  <text x="58" y="160"
    font-family="'JetBrains Mono','SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
    font-size="13" font-weight="500" fill="#FACC15" letter-spacing="3.5">
    COMPUTER ENGINEERING STUDENT
  </text>

  <!-- Thin horizontal rule -->
  <rect x="56" y="178" width="500" height="1" fill="url(#divider)"/>
  <!-- Yellow accent on rule -->
  <rect x="56" y="178" width="96" height="1" fill="#FACC15" opacity="0.6"/>

  <!-- Focus tags -->
  <text x="56" y="202"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif"
    font-size="13.5" fill="#8B949E" letter-spacing="0.3">
    <tspan fill="#C9D1D9">AI</tspan>
    <tspan fill="#30363D">  ·  </tspan>
    <tspan fill="#C9D1D9">Robotics</tspan>
    <tspan fill="#30363D">  ·  </tspan>
    <tspan fill="#C9D1D9">UAV Systems</tspan>
    <tspan fill="#30363D">  ·  </tspan>
    <tspan fill="#C9D1D9">Embedded Systems</tspan>
  </text>

  <!-- Tagline -->
  <text x="56" y="228"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif"
    font-size="12.5" fill="#484F58" letter-spacing="0.2">
    Building intelligent systems at the intersection of software, embedded electronics, and autonomous flight.
  </text>

  <!-- Spec chips row -->
  <g transform="translate(56, 250)">
    <!-- Chip 1 -->
    <rect x="0"   y="0" width="108" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="10"  y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#484F58" letter-spacing="0.5">STACK </text>
    <text x="46"  y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#8B949E">C++ · Python</text>
    <!-- Chip 2 -->
    <rect x="116" y="0" width="108" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="126" y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#484F58" letter-spacing="0.5">FC    </text>
    <text x="154" y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#8B949E">ROS 2 · PX4</text>
    <!-- Chip 3 -->
    <rect x="232" y="0" width="108" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="242" y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#484F58" letter-spacing="0.5">MCU   </text>
    <text x="274" y="15" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#8B949E">ESP32 · STM32</text>
  </g>

  <!-- ── RIGHT: UAV SCHEMATIC ── -->
  <g transform="translate(940, 150)">
    <!-- Outer boundary ring (very faint) -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="#0F1829" stroke-width="1.5"/>
    <!-- Radar ring 2 -->
    <circle cx="0" cy="0" r="94" fill="none" stroke="#FACC15" stroke-width="0.6"
            stroke-dasharray="5 7" stroke-opacity="0.18"/>
    <!-- Radar ring 3 -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#21262D" stroke-width="1" stroke-opacity="0.9"/>
    <!-- Radar ring 4 (inner) -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#161B22" stroke-width="1.2"/>

    <!-- Crosshair lines -->
    <line x1="-138" y1="0" x2="138" y2="0" stroke="#161B22" stroke-width="0.8" stroke-dasharray="3 6"/>
    <line x1="0" y1="-138" x2="0" y2="138" stroke="#161B22" stroke-width="0.8" stroke-dasharray="3 6"/>

    <!-- Sweep indicator line -->
    <line x1="0" y1="0" x2="85" y2="-85" stroke="#FACC15" stroke-width="0.9"
          stroke-opacity="0.45"/>
    <circle cx="85" cy="-85" r="2.5" fill="#FACC15" fill-opacity="0.6"/>

    <!-- ── PCB / CIRCUIT TRACES ── -->
    <!-- Trace from body to top-right arm -->
    <polyline points="10,-10 28,-28 62,-62" fill="none" stroke="#1C2633" stroke-width="1.5"/>
    <!-- Node points on trace -->
    <circle cx="28" cy="-28" r="1.8" fill="#21262D" stroke="#FACC15" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Trace from body to bottom-right -->
    <polyline points="10,10 28,28 62,62" fill="none" stroke="#1C2633" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="1.8" fill="#21262D" stroke="#21262D" stroke-width="0.6"/>

    <!-- Trace from body to bottom-left -->
    <polyline points="-10,10 -28,28 -62,62" fill="none" stroke="#1C2633" stroke-width="1.5"/>
    <circle cx="-28" cy="28" r="1.8" fill="#21262D" stroke="#FACC15" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Trace from body to top-left -->
    <polyline points="-10,-10 -28,-28 -62,-62" fill="none" stroke="#1C2633" stroke-width="1.5"/>
    <circle cx="-28" cy="-28" r="1.8" fill="#21262D" stroke="#21262D" stroke-width="0.6"/>

    <!-- ── AIRFRAME BODY ── -->
    <polygon points="0,-15 12,-12 15,0 12,12 0,15 -12,12 -15,0 -12,-12"
             fill="#070B12" stroke="#FACC15" stroke-width="1.4" filter="url(#glow)"/>
    <!-- Inner body detail -->
    <polygon points="0,-9 7,-7 9,0 7,7 0,9 -7,7 -9,0 -7,-7"
             fill="none" stroke="#1C2633" stroke-width="0.8"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="3.5" fill="#FACC15" filter="url(#softGlow)"/>

    <!-- ── ROTOR NACELLES ── -->
    <!-- Top-Right rotor -->
    <circle cx="62" cy="-62" r="8"  fill="#0A0E16" stroke="#FACC15" stroke-width="1.3" filter="url(#glow)"/>
    <circle cx="62" cy="-62" r="26" fill="none"   stroke="#FACC15" stroke-width="0.7"
            stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <line x1="40" y1="-84" x2="84" y2="-40" stroke="#1C2633" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="62" cy="-62" r="2.5" fill="#FACC15"/>

    <!-- Bottom-Right rotor -->
    <circle cx="62" cy="62"  r="8"  fill="#0A0E16" stroke="#30363D" stroke-width="1.3"/>
    <circle cx="62" cy="62"  r="26" fill="none"   stroke="#30363D" stroke-width="0.7"
            stroke-dasharray="3 5" stroke-opacity="0.4"/>
    <line x1="40" y1="40" x2="84" y2="84" stroke="#1C2633" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="62" cy="62" r="2.5" fill="#30363D"/>

    <!-- Bottom-Left rotor -->
    <circle cx="-62" cy="62"  r="8"  fill="#0A0E16" stroke="#FACC15" stroke-width="1.3" filter="url(#glow)"/>
    <circle cx="-62" cy="62"  r="26" fill="none"   stroke="#FACC15" stroke-width="0.7"
            stroke-dasharray="3 5" stroke-opacity="0.5"/>
    <line x1="-84" y1="40" x2="-40" y2="84" stroke="#1C2633" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-62" cy="62" r="2.5" fill="#FACC15"/>

    <!-- Top-Left rotor -->
    <circle cx="-62" cy="-62" r="8"  fill="#0A0E16" stroke="#30363D" stroke-width="1.3"/>
    <circle cx="-62" cy="-62" r="26" fill="none"   stroke="#30363D" stroke-width="0.7"
            stroke-dasharray="3 5" stroke-opacity="0.4"/>
    <line x1="-84" y1="-84" x2="-40" y2="-40" stroke="#1C2633" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-62" cy="-62" r="2.5" fill="#30363D"/>

    <!-- Heading arrow (forward vector) -->
    <polygon points="-3,-15 0,-27 3,-15" fill="#FACC15" filter="url(#glow)"/>

    <!-- ── TELEMETRY CALLOUTS ── -->
    <!-- Top-right callout -->
    <polyline points="62,-70 90,-96 138,-96"
              fill="none" stroke="#FACC15" stroke-width="0.7" stroke-opacity="0.55"/>
    <rect x="138" y="-107" width="88" height="18" rx="2"
          fill="#070B12" stroke="#21262D" stroke-width="0.8"/>
    <text x="144" y="-94"
      font-family="'JetBrains Mono',monospace" font-size="8" fill="#FACC15"
      font-weight="500" letter-spacing="0.5">PX4 AUTOPILOT</text>

    <!-- Left callout -->
    <polyline points="-14,-12 -96,-44 -138,-44"
              fill="none" stroke="#30363D" stroke-width="0.7"/>
    <rect x="-222" y="-55" width="84" height="18" rx="2"
          fill="#070B12" stroke="#21262D" stroke-width="0.8"/>
    <text x="-217" y="-42"
      font-family="'JetBrains Mono',monospace" font-size="8" fill="#484F58"
      letter-spacing="0.5">MAVLink 2.0</text>

    <!-- Bottom-right callout -->
    <polyline points="62,70 90,96 138,96"
              fill="none" stroke="#30363D" stroke-width="0.7"/>
    <rect x="138" y="86" width="80" height="18" rx="2"
          fill="#070B12" stroke="#21262D" stroke-width="0.8"/>
    <text x="144" y="99"
      font-family="'JetBrains Mono',monospace" font-size="8" fill="#484F58"
      letter-spacing="0.5">ROS 2 Bridge</text>
  </g>

  <!-- ── FOOTER ── -->
  <text x="56" y="291"
    font-family="'JetBrains Mono',monospace" font-size="9" fill="#21262D" letter-spacing="1.2">
    INDIA — 19.076°N  72.877°E
  </text>
  <text x="1144" y="291"
    font-family="'JetBrains Mono',monospace" font-size="9" fill="#21262D"
    letter-spacing="1" text-anchor="end">
    REV 4.0
  </text>
</svg>
