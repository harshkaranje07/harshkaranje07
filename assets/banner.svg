<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Blueprint Grid Pattern -->
    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161B22" stroke-width="0.8"/>
      <circle cx="40" cy="40" r="0.8" fill="#21262D"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="yellowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Base Container -->
  <rect width="1200" height="320" rx="8" fill="url(#bgGrad)" stroke="#21262D" stroke-width="1"/>
  <rect width="1200" height="320" rx="8" fill="url(#blueprint-grid)" opacity="0.6"/>

  <!-- Top Accent Highlight -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#yellowLineGrad)"/>
  <rect x="0" y="318.5" width="1200" height="1.5" fill="url(#yellowLineGrad)" opacity="0.3"/>

  <!-- Blueprint Corner Framing Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.9"/>
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.9"/>
  <path d="M 24 276 L 24 296 L 44 296" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.9"/>
  <path d="M 1176 276 L 1176 296 L 1156 296" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.9"/>

  <!-- Subtle Circuit Traces -->
  <g stroke="#21262D" stroke-width="1" fill="none" opacity="0.6">
    <polyline points="480,220 540,220 580,180 640,180"/>
    <circle cx="480" cy="220" r="2" fill="#FACC15" stroke="none"/>
    <circle cx="640" cy="180" r="2" fill="#FACC15" stroke="none"/>

    <polyline points="500,240 560,240 600,200 660,200"/>
    <circle cx="500" cy="240" r="1.5" fill="#30363D" stroke="none"/>
    <circle cx="660" cy="200" r="1.5" fill="#30363D" stroke="none"/>
  </g>

  <!-- ==================== LEFT SIDE: TYPOGRAPHY ==================== -->
  <g transform="translate(60, 52)">
    <!-- System Status Label -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-10" width="8" height="8" rx="1.5" fill="#FACC15" filter="url(#subtleGlow)"/>
      <text x="18" y="-2" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="500" fill="#6E7681" letter-spacing="2.5">
        SYSTEM ONLINE // MISSION CONTROL
      </text>
    </g>

    <!-- Name -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#F8F8F8" letter-spacing="-1">
      HARSHWARDHAN KARANJE
    </text>

    <!-- Title -->
    <text x="0" y="90" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="13" font-weight="600" fill="#FACC15" letter-spacing="3">
      COMPUTER ENGINEERING STUDENT
    </text>

    <!-- Thin Divider -->
    <line x1="0" y1="108" x2="520" y2="108" stroke="#21262D" stroke-width="1"/>
    <line x1="0" y1="108" x2="100" y2="108" stroke="#FACC15" stroke-width="1.5" opacity="0.8"/>

    <!-- Focus Topics -->
    <text x="0" y="132" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" fill="#8B949E" letter-spacing="0.5">
      AI • ROBOTICS • UAV SYSTEMS
    </text>

    <!-- Tagline -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12.5" fill="#8B949E" letter-spacing="0.2">
      Building intelligent systems at the intersection of software, embedded electronics, and autonomous flight.
    </text>

    <!-- Blueprint Telemetry Data Chips -->
    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="115" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#484F58">SPEC: <tspan fill="#8B949E">AUTONOMOUS</tspan></text>

      <rect x="125" y="0" width="115" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
      <text x="135" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#484F58">CORE: <tspan fill="#FACC15">PX4 / ROS 2</tspan></text>

      <rect x="250" y="0" width="115" height="22" rx="3" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
      <text x="260" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#484F58">MCU: <tspan fill="#8B949E">ESP32 / STM32</tspan></text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: DRONE WIREFRAME & RADAR ==================== -->
  <g transform="translate(940, 160)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#161B22" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#FACC15" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#21262D" stroke-width="1"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#161B22" stroke-width="1"/>

    <!-- Radar Crosshairs -->
    <line x1="-138" y1="0" x2="138" y2="0" stroke="#161B22" stroke-width="0.8" stroke-dasharray="3 5"/>
    <line x1="0" y1="-138" x2="0" y2="138" stroke="#161B22" stroke-width="0.8" stroke-dasharray="3 5"/>

    <!-- Radar Sweep Vector Ray -->
    <line x1="0" y1="0" x2="88" y2="-88" stroke="#FACC15" stroke-width="0.9" stroke-opacity="0.4"/>
    <circle cx="88" cy="-88" r="2" fill="#FACC15" fill-opacity="0.6"/>

    <!-- Drone Quadcopter Wireframe -->
    <g id="drone-illustration">
      <!-- Central Octagonal Chassis -->
      <polygon points="0,-16 13,-13 16,0 13,13 0,16 -13,13 -16,0 -13,-13" fill="#0D1117" stroke="#FACC15" stroke-width="1.4" filter="url(#subtleGlow)"/>
      <polygon points="0,-9 7,-7 9,0 7,7 0,9 -7,7 -9,0 -7,-7" fill="none" stroke="#21262D" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3.5" fill="#FACC15" filter="url(#subtleGlow)"/>

      <!-- 4 Quad Spar Arms -->
      <line x1="11" y1="-11" x2="64" y2="-64" stroke="#30363D" stroke-width="2.5"/>
      <line x1="11" y1="-11" x2="64" y2="-64" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="4 3" stroke-opacity="0.5"/>

      <line x1="11" y1="11" x2="64" y2="64" stroke="#30363D" stroke-width="2.5"/>
      <line x1="11" y1="11" x2="64" y2="64" stroke="#21262D" stroke-width="0.7" stroke-dasharray="4 3"/>

      <line x1="-11" y1="11" x2="-64" y2="64" stroke="#30363D" stroke-width="2.5"/>
      <line x1="-11" y1="11" x2="-64" y2="64" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="4 3" stroke-opacity="0.5"/>

      <line x1="-11" y1="-11" x2="-64" y2="-64" stroke="#30363D" stroke-width="2.5"/>
      <line x1="-11" y1="-11" x2="-64" y2="-64" stroke="#21262D" stroke-width="0.7" stroke-dasharray="4 3"/>

      <!-- Rotor Nacelles & Propeller Arcs -->
      <!-- Rotor 1 (Top-Right) -->
      <circle cx="64" cy="-64" r="8" fill="#0D1117" stroke="#FACC15" stroke-width="1.3" filter="url(#subtleGlow)"/>
      <circle cx="64" cy="-64" r="26" fill="none" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="3 4" stroke-opacity="0.5"/>
      <circle cx="64" cy="-64" r="2.5" fill="#FACC15"/>

      <!-- Rotor 2 (Bottom-Right) -->
      <circle cx="64" cy="64" r="8" fill="#0D1117" stroke="#484F58" stroke-width="1.3"/>
      <circle cx="64" cy="64" r="26" fill="none" stroke="#30363D" stroke-width="0.7" stroke-dasharray="3 4" stroke-opacity="0.4"/>
      <circle cx="64" cy="64" r="2.5" fill="#30363D"/>

      <!-- Rotor 3 (Bottom-Left) -->
      <circle cx="-64" cy="64" r="8" fill="#0D1117" stroke="#FACC15" stroke-width="1.3" filter="url(#subtleGlow)"/>
      <circle cx="-64" cy="64" r="26" fill="none" stroke="#FACC15" stroke-width="0.7" stroke-dasharray="3 4" stroke-opacity="0.5"/>
      <circle cx="-64" cy="64" r="2.5" fill="#FACC15"/>

      <!-- Rotor 4 (Top-Left) -->
      <circle cx="-64" cy="-64" r="8" fill="#0D1117" stroke="#484F58" stroke-width="1.3"/>
      <circle cx="-64" cy="-64" r="26" fill="none" stroke="#30363D" stroke-width="0.7" stroke-dasharray="3 4" stroke-opacity="0.4"/>
      <circle cx="-64" cy="-64" r="2.5" fill="#30363D"/>

      <!-- Heading Indicator (Forward Vector) -->
      <polygon points="-3,-16 0,-27 3,-16" fill="#FACC15" filter="url(#subtleGlow)"/>

      <!-- Telemetry Callout Tags -->
      <polyline points="64,-72 92,-96 140,-96" fill="none" stroke="#FACC15" stroke-width="0.7" stroke-opacity="0.6"/>
      <rect x="140" y="-107" width="90" height="18" rx="2" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="147" y="-95" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FACC15" font-weight="500">PX4 AUTOPILOT</text>

      <polyline points="-14,-12 -96,-42 -140,-42" fill="none" stroke="#30363D" stroke-width="0.7"/>
      <rect x="-218" y="-53" width="78" height="18" rx="2" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="-211" y="-41" font-family="'JetBrains Mono', monospace" font-size="8" fill="#484F58">MAVLink 2.0</text>

      <polyline points="64,72 92,96 140,96" fill="none" stroke="#30363D" stroke-width="0.7"/>
      <rect x="140" y="87" width="78" height="18" rx="2" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="147" y="99" font-family="'JetBrains Mono', monospace" font-size="8" fill="#484F58">ROS 2 Bridge</text>
    </g>
  </g>

  <!-- Technical Footer Coordinates -->
  <text x="60" y="304" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#21262D" letter-spacing="1">
    LAT: 19.0760° N | LON: 72.8777° E | ALT: 120M | FLIGHT MODE: AUTONOMOUS
  </text>
</svg>
