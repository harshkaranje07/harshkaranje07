<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F17; }
      .grid-line { stroke: #1E293B; stroke-width: 0.5; stroke-dasharray: 2 4; }
      .accent { stroke: #FACC15; stroke-width: 1.5; }
      .accent-fill { fill: #FACC15; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 800; font-size: 34px; fill: #F8FAFC; }
      .text-sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; fill: #FACC15; letter-spacing: 2px; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; }
      .text-dim { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #475569; }
      .box { fill: #0F172A; stroke: #1E293B; stroke-width: 1; rx: 4px; }
    </style>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1420"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="8" fill="url(#bannerGrad)" stroke="#1F2937" stroke-width="1.2"/>

  <!-- Minimal Technical Layout Lines -->
  <line x1="40" y1="20" x2="1160" y2="20" class="grid-line"/>
  <line x1="40" y1="280" x2="1160" y2="280" class="grid-line"/>
  <line x1="40" y1="20" x2="40" y2="280" class="grid-line"/>
  <line x1="1160" y1="20" x2="1160" y2="280" class="grid-line"/>

  <!-- Corner Brackets -->
  <path d="M 34 50 L 34 34 L 50 34" fill="none" stroke="#FACC15" stroke-width="2"/>
  <path d="M 1166 50 L 1166 34 L 1150 34" fill="none" stroke="#FACC15" stroke-width="2"/>
  <path d="M 34 250 L 34 266 L 50 266" fill="none" stroke="#FACC15" stroke-width="2"/>
  <path d="M 1166 250 L 1166 266 L 1150 266" fill="none" stroke="#FACC15" stroke-width="2"/>

  <!-- LEFT COLUMN: TYPOGRAPHY & CORE GOALS -->
  <g transform="translate(60, 55)">
    <!-- Status Tag -->
    <rect x="0" y="0" width="210" height="22" rx="3" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <circle cx="12" cy="11" r="3" fill="#FACC15"/>
    <text x="22" y="15" class="text-sub" font-size="10" letter-spacing="1">SYSTEM ONLINE // PORTFOLIO</text>

    <!-- Name & Subtitle -->
    <text x="0" y="58" class="text-title">Harshwardhan Karanje</text>
    <text x="0" y="82" class="text-sub">COMPUTER ENGINEERING STUDENT</text>

    <!-- Engineering Directive Box -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="460" height="68" class="box"/>
      <path d="M 0 0 L 80 0" stroke="#FACC15" stroke-width="2"/>
      
      <text x="14" y="22" class="text-mono">OBJECTIVE: <tspan fill="#F8FAFC">Autonomous UAVs • Robotics • Embedded IoT</tspan></text>
      <text x="14" y="42" class="text-mono">FOCUS: <tspan fill="#FACC15">Machine Learning &amp; Computer Vision Systems</tspan></text>
      <text x="14" y="58" class="text-mono">STACK: <tspan fill="#38BDF8">C++ / Python / ROS 2 / PyTorch / ESP32</tspan></text>
    </g>
  </g>

  <!-- RIGHT COLUMN: SCHEMATIC QUADCOPTER DIAGRAM -->
  <g transform="translate(930, 150)">
    <!-- Radar Circle Rings -->
    <circle cx="0" cy="0" r="125" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Crosshairs -->
    <line x1="-135" y1="0" x2="135" y2="0" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="0" y1="-135" x2="0" y2="135" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- Quadcopter Body Schematic -->
    <polygon points="0,-16 12,-12 16,0 12,12 0,16 -12,12 -16,0 -12,-12" fill="#0D1117" stroke="#FACC15" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FACC15"/>

    <!-- 4 Rotor Spar Arms -->
    <line x1="9" y1="-9" x2="58" y2="-58" stroke="#94A3B8" stroke-width="2"/>
    <line x1="9" y1="9" x2="58" y2="58" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-9" y1="9" x2="-58" y2="58" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-9" y1="-9" x2="-58" y2="-58" stroke="#94A3B8" stroke-width="2"/>

    <!-- Rotors -->
    <circle cx="58" cy="-58" r="8" fill="#1E293B" stroke="#FACC15" stroke-width="1"/>
    <circle cx="58" cy="-58" r="26" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>

    <circle cx="58" cy="58" r="8" fill="#1E293B" stroke="#FACC15" stroke-width="1"/>
    <circle cx="58" cy="58" r="26" fill="none" stroke="#64748B" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>

    <circle cx="-58" cy="58" r="8" fill="#1E293B" stroke="#FACC15" stroke-width="1"/>
    <circle cx="-58" cy="58" r="26" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>

    <circle cx="-58" cy="-58" r="8" fill="#1E293B" stroke="#FACC15" stroke-width="1"/>
    <circle cx="-58" cy="-58" r="26" fill="none" stroke="#64748B" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>

    <!-- Telemetry Callout Tags -->
    <polyline points="58,-66 85,-90 135,-90" fill="none" stroke="#FACC15" stroke-width="0.8"/>
    <rect x="135" y="-100" width="100" height="18" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="141" y="-88" class="text-mono" fill="#FACC15" font-size="8.5">UAV AVIONICS</text>

    <polyline points="-12,-12 -90,-40 -130,-40" fill="none" stroke="#64748B" stroke-width="0.8"/>
    <rect x="-215" y="-50" width="85" height="18" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="-210" y="-38" class="text-mono" fill="#94A3B8" font-size="8.5">PX4 / ROS 2</text>
  </g>

  <!-- Bottom Technical Coordinate Footer -->
  <g transform="translate(60, 272)">
    <text x="0" y="0" class="text-dim">MAHARASHTRA, INDIA | LAT: 19.0760° N | LON: 72.8777° E | ENGINEERING PORTFOLIO</text>
  </g>
</svg>
