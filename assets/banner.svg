<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
      <circle cx="30" cy="30" r="0.8" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Frame & Base -->
  <rect width="1200" height="340" rx="10" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="10" fill="url(#grid)"/>

  <!-- Precision Corner Markers -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M 1184 36 L 1184 16 L 1164 16" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M 16 304 L 16 324 L 36 324" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M 1184 304 L 1184 324 L 1164 324" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.9"/>

  <line x1="50" y1="24" x2="1150" y2="24" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="50" y1="316" x2="1150" y2="316" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- ================= RIGHT SIDE: RADAR & DRONE WIREFRAME ================= -->
  <g transform="translate(930, 170)">
    <!-- Radar Base -->
    <circle cx="0" cy="0" r="145" fill="url(#radarGlow)"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#334155" stroke-width="0.8"/>

    <!-- Crosshairs & Vectors -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
    
    <!-- Sweep Ray -->
    <line x1="0" y1="0" x2="98" y2="-98" stroke="#FACC15" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="98" cy="-98" r="3" fill="#FACC15"/>

    <!-- UAV Quadcopter Wireframe -->
    <g id="drone-graphics">
      <!-- Main Octagon Airframe -->
      <polygon points="0,-18 13,-13 18,0 13,13 0,18 -13,13 -18,0 -13,-13" fill="#0D1117" stroke="#FACC15" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#FACC15"/>

      <!-- Quad Spar Arms -->
      <line x1="10" y1="-10" x2="65" y2="-65" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="10" y1="10" x2="65" y2="65" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="-10" y1="10" x2="-65" y2="65" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="-10" y1="-10" x2="-65" y2="-65" stroke="#94A3B8" stroke-width="2.5"/>

      <!-- Inner Accent Lines -->
      <line x1="10" y1="-10" x2="65" y2="-65" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 2"/>
      <line x1="10" y1="10" x2="65" y2="65" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 2"/>
      <line x1="-10" y1="10" x2="-65" y2="65" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 2"/>
      <line x1="-10" y1="-10" x2="-65" y2="-65" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="3 2"/>

      <!-- Rotor Nacelles & Propeller Arcs -->
      <!-- Rotor 1 -->
      <circle cx="65" cy="-65" r="9" fill="#1E293B" stroke="#FACC15" stroke-width="1.2"/>
      <circle cx="65" cy="-65" r="30" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.6"/>
      <circle cx="65" cy="-65" r="2.5" fill="#FACC15"/>

      <!-- Rotor 2 -->
      <circle cx="65" cy="65" r="9" fill="#1E293B" stroke="#FACC15" stroke-width="1.2"/>
      <circle cx="65" cy="65" r="30" fill="none" stroke="#64748B" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.6"/>
      <circle cx="65" cy="65" r="2.5" fill="#FACC15"/>

      <!-- Rotor 3 -->
      <circle cx="-65" cy="65" r="9" fill="#1E293B" stroke="#FACC15" stroke-width="1.2"/>
      <circle cx="-65" cy="65" r="30" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.6"/>
      <circle cx="-65" cy="65" r="2.5" fill="#FACC15"/>

      <!-- Rotor 4 -->
      <circle cx="-65" cy="-65" r="9" fill="#1E293B" stroke="#FACC15" stroke-width="1.2"/>
      <circle cx="-65" cy="-65" r="30" fill="none" stroke="#64748B" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.6"/>
      <circle cx="-65" cy="-65" r="2.5" fill="#FACC15"/>

      <!-- Forward Heading Vector -->
      <polygon points="-4,-18 0,-28 4,-18" fill="#FACC15"/>

      <!-- Telemetry Tags -->
      <polyline points="65,-75 95,-100 145,-100" fill="none" stroke="#FACC15" stroke-width="0.8"/>
      <rect x="145" y="-111" width="115" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="152" y="-97" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FACC15" font-weight="600">SYS_ALT: 120M</text>

      <polyline points="-13,-13 -100,-45 -145,-45" fill="none" stroke="#64748B" stroke-width="0.8"/>
      <rect x="-250" y="-56" width="105" height="20" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="-243" y="-42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">MODE: AUTONOMOUS</text>
    </g>
  </g>

  <!-- ================= LEFT SIDE: TYPOGRAPHY & HUD ================= -->
  <g transform="translate(60, 50)">
    <!-- Header Status -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="24" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#FACC15"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FACC15" font-weight="700" letter-spacing="1">SYSTEM ONLINE // CORE</text>
    </g>

    <!-- Name -->
    <text x="0" y="66" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      Harshwardhan Karanje
    </text>

    <!-- Title -->
    <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FACC15" letter-spacing="1">
      COMPUTER ENGINEERING STUDENT
    </text>

    <!-- Specs Divider Line -->
    <line x1="0" y1="115" x2="440" y2="115" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="115" x2="100" y2="115" stroke="#FACC15" stroke-width="2"/>

    <!-- Focus Tags -->
    <text x="0" y="138" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8">
      FOCUS: <tspan fill="#F8FAFC">AI</tspan> • <tspan fill="#F8FAFC">ROBOTICS</tspan> • <tspan fill="#F8FAFC">UAV SYSTEMS</tspan> • <tspan fill="#F8FAFC">EMBEDDED</tspan>
    </text>

    <!-- Sleek Tech Box -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="440" height="60" rx="6" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <path d="M 0 0 L 60 0" stroke="#FACC15" stroke-width="2"/>
      
      <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#CBD5E1">
        ENGINEERING: <tspan fill="#FACC15">Autonomous UAVs &amp; Flight Avionics</tspan>
      </text>
      <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#CBD5E1">
        CORE STACK: <tspan fill="#38BDF8">C++ / Python / ROS 2 / PyTorch / ESP32</tspan>
      </text>
    </g>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(60, 305)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#475569">
      LAT: 19.0760° N | LON: 72.8777° E | ALT: 120M | STATUS: ACTIVE
    </text>
  </g>
</svg>
