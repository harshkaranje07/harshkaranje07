<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.8"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3"/>
    </pattern>

    <!-- Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="yellowFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="12" fill="url(#grid)"/>

  <!-- Subtle Accent Corner Framing -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1188 40 L 1188 12 L 1160 12" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 12 320 L 12 348 L 40 348" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1188 320 L 1188 348 L 1160 348" fill="none" stroke="#FACC15" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Technical Crosshairs & Corner Ticks -->
  <line x1="60" y1="20" x2="1140" y2="20" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="340" x2="1140" y2="340" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== RIGHT SIDE: RADAR & DRONE WIREFRAME ==================== -->
  <g transform="translate(910, 180)">
    <!-- Radar Background Glow & Rings -->
    <circle cx="0" cy="0" r="160" fill="url(#radarSweep)"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FACC15" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#FACC15" fill-opacity="0.6"/>

    <!-- Radar Crosshairs -->
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 4"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 4"/>
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#1E293B" stroke-width="0.6" stroke-dasharray="2 4"/>
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="#1E293B" stroke-width="0.6" stroke-dasharray="2 4"/>

    <!-- Radar Angle Callouts -->
    <text x="0" y="-165" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#64748B" text-anchor="middle">000° N</text>
    <text x="165" y="3" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#64748B" text-anchor="start">090° E</text>
    <text x="0" y="173" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#64748B" text-anchor="middle">180° S</text>
    <text x="-165" y="3" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#64748B" text-anchor="end">270° W</text>

    <!-- Radar Sweep Line -->
    <line x1="0" y1="0" x2="113" y2="-113" stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="113" cy="-113" r="3" fill="#FACC15"/>
    <circle cx="113" cy="-113" r="7" fill="none" stroke="#FACC15" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- ================= DRONE WIREFRAME (QUADCOPTER) ================= -->
    <g id="drone-wireframe">
      <!-- Central Chassis Octagon -->
      <polygon points="0,-22 16,-16 22,0 16,16 0,22 -16,16 -22,0 -16,-16" fill="#0D1117" stroke="#FACC15" stroke-width="1.5"/>
      <polygon points="0,-14 10,-10 14,0 10,10 0,14 -10,10 -14,0 -10,-10" fill="none" stroke="#475569" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#FACC15" fill-opacity="0.8"/>

      <!-- Quad Arms (4 Rotors) -->
      <!-- Arm 1: Top-Right -->
      <line x1="12" y1="-12" x2="75" y2="-75" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="12" y1="-12" x2="75" y2="-75" stroke="#FACC15" stroke-width="1" stroke-dasharray="4 2"/>
      <!-- Arm 2: Bottom-Right -->
      <line x1="12" y1="12" x2="75" y2="75" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="12" y1="12" x2="75" y2="75" stroke="#FACC15" stroke-width="1" stroke-dasharray="4 2"/>
      <!-- Arm 3: Bottom-Left -->
      <line x1="-12" y1="12" x2="-75" y2="75" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="-12" y1="12" x2="-75" y2="75" stroke="#FACC15" stroke-width="1" stroke-dasharray="4 2"/>
      <!-- Arm 4: Top-Left -->
      <line x1="-12" y1="-12" x2="-75" y2="-75" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="-12" y1="-12" x2="-75" y2="-75" stroke="#FACC15" stroke-width="1" stroke-dasharray="4 2"/>

      <!-- Rotor Motors & Propellers -->
      <!-- Rotor 1 (Top-Right) -->
      <circle cx="75" cy="-75" r="10" fill="#1E293B" stroke="#FACC15" stroke-width="1.5"/>
      <circle cx="75" cy="-75" r="35" fill="none" stroke="#FACC15" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>
      <line x1="50" y1="-100" x2="100" y2="-50" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="75" cy="-75" r="3" fill="#FACC15"/>

      <!-- Rotor 2 (Bottom-Right) -->
      <circle cx="75" cy="75" r="10" fill="#1E293B" stroke="#FACC15" stroke-width="1.5"/>
      <circle cx="75" cy="75" r="35" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>
      <line x1="50" y1="50" x2="100" y2="100" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="75" cy="75" r="3" fill="#FACC15"/>

      <!-- Rotor 3 (Bottom-Left) -->
      <circle cx="-75" cy="75" r="10" fill="#1E293B" stroke="#FACC15" stroke-width="1.5"/>
      <circle cx="-75" cy="75" r="35" fill="none" stroke="#FACC15" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>
      <line x1="-100" y1="50" x2="-50" y2="100" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="-75" cy="75" r="3" fill="#FACC15"/>

      <!-- Rotor 4 (Top-Left) -->
      <circle cx="-75" cy="-75" r="10" fill="#1E293B" stroke="#FACC15" stroke-width="1.5"/>
      <circle cx="-75" cy="-75" r="35" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>
      <line x1="-100" y1="-100" x2="-50" y2="-50" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="-75" cy="-75" r="3" fill="#FACC15"/>

      <!-- Gimbal Nose Camera (Forward Vector) -->
      <path d="M -6,-22 L 0,-34 L 6,-22 Z" fill="#FACC15"/>
      <circle cx="0" cy="-34" r="3" fill="#0D1117" stroke="#FACC15" stroke-width="1"/>

      <!-- Telemetry Callout Leader Lines -->
      <!-- Callout 1: Motor 01 -->
      <polyline points="75,-85 110,-115 170,-115" fill="none" stroke="#FACC15" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="75" cy="-85" r="2" fill="#FACC15"/>
      <rect x="170" y="-127" width="125" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="178" y="-112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FACC15" font-weight="600">SYS_MTR: 8,400 RPM</text>

      <!-- Callout 2: FC Core -->
      <polyline points="-16,-16 -130,-50 -190,-50" fill="none" stroke="#64748B" stroke-width="1"/>
      <circle cx="-16" cy="-16" r="2" fill="#FACC15"/>
      <rect x="-310" y="-62" width="120" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="-302" y="-47" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">FC: PX4 AUTOPILOT</text>

      <!-- Callout 3: Battery Telemetry -->
      <polyline points="75,85 120,115 170,115" fill="none" stroke="#64748B" stroke-width="1"/>
      <circle cx="75" cy="85" r="2" fill="#FACC15"/>
      <rect x="170" y="103" width="125" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="178" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">BAT: 98.4% [22.2V]</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: MISSION CONTROL UI ==================== -->
  <g transform="translate(60, 45)">
    <!-- Top System Status pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#FACC15">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#FACC15" font-weight="700" letter-spacing="1">SYS.ON // MISSION CONTROL</text>
      <text x="205" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">v2.4</text>
    </g>

    <!-- Main Title (Name) -->
    <text x="0" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      Harshwardhan Karanje
    </text>

    <!-- Subtitle / Role -->
    <g transform="translate(0, 84)">
      <text x="0" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="15" font-weight="700" fill="#FACC15" letter-spacing="1">
        COMPUTER ENGINEERING STUDENT
      </text>
    </g>

    <!-- Focus Tags & Divider Line -->
    <g transform="translate(0, 122)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#FACC15" stroke-width="2"/>
      
      <!-- Tech Domain Pills -->
      <g transform="translate(0, 16)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94A3B8">
          FOCUS: <tspan fill="#F8FAFC">AI</tspan> • <tspan fill="#F8FAFC">ROBOTICS</tspan> • <tspan fill="#F8FAFC">UAV SYSTEMS</tspan> • <tspan fill="#F8FAFC">EMBEDDED</tspan>
        </text>
      </g>
    </g>

    <!-- Bottom Telemetry HUD Box -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="460" height="74" rx="8" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.5"/>
      
      <!-- Box Top Accent Line -->
      <path d="M 0 0 L 80 0" stroke="#FACC15" stroke-width="2"/>

      <!-- HUD Metric Lines -->
      <g transform="translate(16, 22)">
        <!-- Metric 1 -->
        <circle cx="4" cy="4" r="3" fill="#FACC15"/>
        <text x="14" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">
          SPECS: <tspan fill="#FACC15" font-weight="600">Autonomous UAVs &amp; Flight Controls</tspan>
        </text>

        <!-- Metric 2 -->
        <circle cx="4" cy="26" r="3" fill="#38BDF8"/>
        <text x="14" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">
          STACK: <tspan fill="#38BDF8">C++ / Python / ROS 2 / PyTorch / ESP32</tspan>
        </text>

        <!-- Metric 3 -->
        <circle cx="4" cy="48" r="3" fill="#4ADE80"/>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">
          STATUS: <tspan fill="#4ADE80">Ready for Engineering Challenges</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Circuit Traces Connecting UI to Center/Right -->
  <g stroke="#334155" stroke-width="1" fill="none">
    <polyline points="520,260 580,260 620,210 680,210"/>
    <circle cx="520" cy="260" r="2.5" fill="#FACC15"/>
    <circle cx="680" cy="210" r="2.5" fill="#FACC15"/>

    <polyline points="520,230 560,230 590,170 650,170"/>
    <circle cx="520" cy="230" r="2" fill="#38BDF8"/>
    <circle cx="650" cy="170" r="2" fill="#38BDF8"/>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 328)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">
      LAT: 19.0760° N | LON: 72.8777° E | ALT: 120M | FLIGHT MODE: GUIDED | SIGNAL: 100%
    </text>
  </g>
</svg>
