<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <style>
      .bg-rect { fill: #0D1117; stroke: #1F2937; stroke-width: 1px; rx: 6px; }
      .cell-off { fill: #161B22; rx: 2px; }
      .cell-low { fill: #1E293B; rx: 2px; }
      .cell-med { fill: #334155; rx: 2px; }
      .cell-high { fill: #EAB308; rx: 2px; }
      .cell-active { fill: #FACC15; rx: 2px; filter: drop-shadow(0 0 3px #FACC15); }
      .text-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #94A3B8; letter-spacing: 1px; }
      .text-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold; fill: #FACC15; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="850" height="140" class="bg-rect"/>

  <!-- Header -->
  <g transform="translate(20, 22)">
    <circle cx="4" cy="-3" r="3" fill="#FACC15"/>
    <text x="14" y="0" class="text-title">CONTRIBUTION ACTIVITY TELEMETRY</text>
  </g>

  <!-- Telemetry Grid -->
  <g transform="translate(20, 36)">
    <!-- Column 0 to 34 -->
    <!-- Col 0 -->
    <rect x="0" y="0" width="12" height="12" class="cell-off"/>
    <rect x="0" y="15" width="12" height="12" class="cell-low"/>
    <rect x="0" y="30" width="12" height="12" class="cell-off"/>
    <rect x="0" y="45" width="12" height="12" class="cell-med"/>
    <rect x="0" y="60" width="12" height="12" class="cell-off"/>

    <!-- Col 1 -->
    <rect x="15" y="0" width="12" height="12" class="cell-med"/>
    <rect x="15" y="15" width="12" height="12" class="cell-off"/>
    <rect x="15" y="30" width="12" height="12" class="cell-high"/>
    <rect x="15" y="45" width="12" height="12" class="cell-low"/>
    <rect x="15" y="60" width="12" height="12" class="cell-off"/>

    <!-- Col 2 -->
    <rect x="30" y="0" width="12" height="12" class="cell-off"/>
    <rect x="30" y="15" width="12" height="12" class="cell-med"/>
    <rect x="30" y="30" width="12" height="12" class="cell-low"/>
    <rect x="30" y="45" width="12" height="12" class="cell-off"/>
    <rect x="30" y="60" width="12" height="12" class="cell-high"/>

    <g transform="translate(45,0)">
      <rect x="0" y="0" width="12" height="12" class="cell-low"/>
      <rect x="0" y="15" width="12" height="12" class="cell-off"/>
      <rect x="0" y="30" width="12" height="12" class="cell-med"/>
      <rect x="0" y="45" width="12" height="12" class="cell-high"/>
      <rect x="0" y="60" width="12" height="12" class="cell-low"/>

      <rect x="15" y="0" width="12" height="12" class="cell-off"/>
      <rect x="15" y="15" width="12" height="12" class="cell-med"/>
      <rect x="15" y="30" width="12" height="12" class="cell-off"/>
      <rect x="15" y="45" width="12" height="12" class="cell-off"/>
      <rect x="15" y="60" width="12" height="12" class="cell-med"/>

      <rect x="30" y="0" width="12" height="12" class="cell-high"/>
      <rect x="30" y="15" width="12" height="12" class="cell-low"/>
      <rect x="30" y="30" width="12" height="12" class="cell-med"/>
      <rect x="30" y="45" width="12" height="12" class="cell-off"/>
      <rect x="30" y="60" width="12" height="12" class="cell-off"/>
    </g>

    <g transform="translate(90,0)">
      <rect x="0" y="0" width="12" height="12" class="cell-off"/>
      <rect x="0" y="15" width="12" height="12" class="cell-med"/>
      <rect x="0" y="30" width="12" height="12" class="cell-high"/>
      <rect x="0" y="45" width="12" height="12" class="cell-low"/>
      <rect x="0" y="60" width="12" height="12" class="cell-off"/>

      <rect x="15" y="0" width="12" height="12" class="cell-low"/>
      <rect x="15" y="15" width="12" height="12" class="cell-off"/>
      <rect x="15" y="30" width="12" height="12" class="cell-off"/>
      <rect x="15" y="45" width="12" height="12" class="cell-high"/>
      <rect x="15" y="60" width="12" height="12" class="cell-med"/>

      <rect x="30" y="0" width="12" height="12" class="cell-med"/>
      <rect x="30" y="15" width="12" height="12" class="cell-high"/>
      <rect x="30" y="30" width="12" height="12" class="cell-low"/>
      <rect x="30" y="45" width="12" height="12" class="cell-off"/>
      <rect x="30" y="60" width="12" height="12" class="cell-off"/>
    </g>

    <g transform="translate(135,0)">
      <rect x="0" y="0" width="12" height="12" class="cell-med"/>
      <rect x="0" y="15" width="12" height="12" class="cell-off"/>
      <rect x="0" y="30" width="12" height="12" class="cell-med"/>
      <rect x="0" y="45" width="12" height="12" class="cell-off"/>
      <rect x="0" y="60" width="12" height="12" class="cell-high"/>

      <rect x="15" y="0" width="12" height="12" class="cell-off"/>
      <rect x="15" y="15" width="12" height="12" class="cell-high"/>
      <rect x="15" y="30" width="12" height="12" class="cell-low"/>
      <rect x="15" y="45" width="12" height="12" class="cell-med"/>
      <rect x="15" y="60" width="12" height="12" class="cell-off"/>

      <rect x="30" y="0" width="12" height="12" class="cell-med"/>
      <rect x="30" y="15" width="12" height="12" class="cell-off"/>
      <rect x="30" y="30" width="12" height="12" class="cell-off"/>
      <rect x="30" y="45" width="12" height="12" class="cell-high"/>
      <rect x="30" y="60" width="12" height="12" class="cell-low"/>
    </g>

    <g transform="translate(180,0)">
      <rect x="0" y="0" width="12" height="12" class="cell-off"/>
      <rect x="0" y="15" width="12" height="12" class="cell-low"/>
      <rect x="0" y="30" width="12" height="12" class="cell-med"/>
      <rect x="0" y="45" width="12" height="12" class="cell-high"/>
      <rect x="0" y="60" width="12" height="12" class="cell-med"/>

      <rect x="15" y="0" width="12" height="12" class="cell-high"/>
      <rect x="15" y="15" width="12" height="12" class="cell-off"/>
      <rect x="15" y="30" width="12" height="12" class="cell-med"/>
      <rect x="15" y="45" width="12" height="12" class="cell-med"/>
      <rect x="15" y="60" width="12" height="12" class="cell-off"/>

      <rect x="30" y="0" width="12" height="12" class="cell-low"/>
      <rect x="30" y="15" width="12" height="12" class="cell-high"/>
      <rect x="30" y="30" width="12" height="12" class="cell-off"/>
      <rect x="30" y="45" width="12" height="12" class="cell-off"/>
      <rect x="30" y="60" width="12" height="12" class="cell-med"/>
    </g>

    <!-- Animated Telemetry Tracker Node (Snake Node) -->
    <g class="snake-nodes">
      <rect x="195" y="30" width="12" height="12" class="cell-active">
        <animate attributeName="x" values="195;210;225;240;255;270;270;255;240;225;210;195" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;45;60;60;60;60;45;30" dur="10s" repeatCount="indefinite"/>
      </rect>
      <rect x="180" y="30" width="12" height="12" class="cell-high">
        <animate attributeName="x" values="180;195;210;225;240;255;270;270;255;240;225;195" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;30;45;60;60;60;60;30" dur="10s" repeatCount="indefinite"/>
      </rect>
      <rect x="165" y="30" width="12" height="12" class="cell-med">
        <animate attributeName="x" values="165;180;195;210;225;240;255;270;270;255;240;180" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;30;30;45;60;60;60;30" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="20" y="125" class="text-sub" fill="#475569">STATUS: ACTIVE CONTINUOUS INTEGRATION</text>
</svg>
