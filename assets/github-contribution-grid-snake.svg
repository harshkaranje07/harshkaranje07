<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .empty { fill: #161B22; rx: 2px; }
      .c1 { fill: #0E4429; rx: 2px; }
      .c2 { fill: #006D32; rx: 2px; }
      .c3 { fill: #26A641; rx: 2px; }
      .c4 { fill: #FACC15; rx: 2px; }
      .snake { fill: #FACC15; rx: 3px; filter: drop-shadow(0px 0px 4px #FACC15); }
      .text { font-family: monospace; font-size: 10px; fill: #9CA3AF; }
    </style>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <rect width="850" height="150" rx="8" fill="#0D1117" stroke="#1F2937" stroke-width="1"/>

  <!-- Grid Header -->
  <text x="20" y="24" class="text" fill="#FACC15" font-weight="bold">SYSTEM ACTIVITY TELEMETRY</text>

  <!-- Simulated Contribution Grid (52 weeks x 7 days) -->
  <g transform="translate(20, 38)">
    <!-- Generating representative contribution squares -->
    <g transform="translate(0,0)">
      <!-- Render 48 columns of grid cells -->
      <!-- Col 0..47 -->
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#161B22"/>
      <rect x="0" y="15" width="12" height="12" rx="2" fill="#0E4429"/>
      <rect x="0" y="30" width="12" height="12" rx="2" fill="#161B22"/>
      <rect x="0" y="45" width="12" height="12" rx="2" fill="#26A641"/>
      <rect x="0" y="60" width="12" height="12" rx="2" fill="#161B22"/>

      <rect x="15" y="0" width="12" height="12" rx="2" fill="#006D32"/>
      <rect x="15" y="15" width="12" height="12" rx="2" fill="#161B22"/>
      <rect x="15" y="30" width="12" height="12" rx="2" fill="#FACC15"/>
      <rect x="15" y="45" width="12" height="12" rx="2" fill="#0E4429"/>
      <rect x="15" y="60" width="12" height="12" rx="2" fill="#161B22"/>

      <rect x="30" y="0" width="12" height="12" rx="2" fill="#161B22"/>
      <rect x="30" y="15" width="12" height="12" rx="2" fill="#26A641"/>
      <rect x="30" y="30" width="12" height="12" rx="2" fill="#006D32"/>
      <rect x="30" y="45" width="12" height="12" rx="2" fill="#161B22"/>
      <rect x="30" y="60" width="12" height="12" rx="2" fill="#FACC15"/>

      <!-- Additional cols -->
      <g transform="translate(45,0)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="0" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="0" y="45" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#0E4429"/>

        <rect x="15" y="0" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="45" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="60" width="12" height="12" rx="2" fill="#26A641"/>

        <rect x="30" y="0" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="30" y="45" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="60" width="12" height="12" rx="2" fill="#161B22"/>
      </g>

      <g transform="translate(90,0)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="15" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="0" y="45" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#161B22"/>

        <rect x="15" y="0" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="45" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="15" y="60" width="12" height="12" rx="2" fill="#006D32"/>

        <rect x="30" y="0" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="30" y="45" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="60" width="12" height="12" rx="2" fill="#161B22"/>
      </g>

      <g transform="translate(135,0)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="0" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="0" y="45" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#FACC15"/>

        <rect x="15" y="0" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="15" y="45" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="15" y="60" width="12" height="12" rx="2" fill="#161B22"/>

        <rect x="30" y="0" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="45" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="30" y="60" width="12" height="12" rx="2" fill="#0E4429"/>
      </g>

      <g transform="translate(180,0)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="15" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="0" y="45" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#26A641"/>

        <rect x="15" y="0" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="15" y="45" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="15" y="60" width="12" height="12" rx="2" fill="#161B22"/>

        <rect x="30" y="0" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="45" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="60" width="12" height="12" rx="2" fill="#26A641"/>
      </g>

      <g transform="translate(225,0)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="0" y="15" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="0" y="45" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#0E4429"/>

        <rect x="15" y="0" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="15" y="45" width="12" height="12" rx="2" fill="#0E4429"/>
        <rect x="15" y="60" width="12" height="12" rx="2" fill="#161B22"/>

        <rect x="30" y="0" width="12" height="12" rx="2" fill="#006D32"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#161B22"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#FACC15"/>
        <rect x="30" y="45" width="12" height="12" rx="2" fill="#26A641"/>
        <rect x="30" y="60" width="12" height="12" rx="2" fill="#0E4429"/>
      </g>
    </g>

    <!-- Animated Snake Overlay -->
    <g class="snake">
      <rect x="210" y="30" width="12" height="12" rx="2" fill="#FACC15">
        <animate attributeName="x" values="210;225;240;255;270;280;280;265;250;235;220;210" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;45;60;60;60;60;45;30" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="195" y="30" width="12" height="12" rx="2" fill="#EAB308">
        <animate attributeName="x" values="195;210;225;240;255;270;280;280;265;250;235;210" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;30;45;60;60;60;60;45" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="180" y="30" width="12" height="12" rx="2" fill="#CA8A04">
        <animate attributeName="x" values="180;195;210;225;240;255;270;280;280;265;250;235" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;30;30;30;30;30;30;45;60;60;60;60" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Telemetry footer label -->
  <text x="20" y="132" class="text" fill="#475569">Snake Telemetry Engine | Active</text>
</svg>
